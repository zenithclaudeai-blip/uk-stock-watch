name: LSE Data Source Diagnostic v7

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and browser
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run diagnostic v7
        run: python diagnose_lse_data_sources_v7.py

      - name: Upload summary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lse-diagnostic-report-v7
          path: lse_diagnostic_report_v7.json
          retention-days: 14

      - name: Upload full response bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lse-response-bodies-v7
          path: lse_bodies_v7/
          retention-days: 14
