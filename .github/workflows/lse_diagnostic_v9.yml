name: LSE Data Source Diagnostic v9 (Screenshots)

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and browser
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run v9 screenshot reconnaissance
        run: python diagnose_lse_v9_screenshots.py

      - name: Upload screenshots and page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lse-v9-screenshots
          path: |
            v9_screenshot_*.png
            v9_visible_text.txt
            v9_interactive_elements.json
          retention-days: 14
